name: uvr PoC

# Proof of concept: resolve and install this package's dependency tree with uvr
# (https://github.com/nbafrank/uvr) instead of the usual Bioconductor container
# + r-lib/actions path, then run the standard R CMD build/check on top of it.
# Runs alongside check-bioc.yml — it does not replace it.

on:
  push:
    branches: [poc/uvr-ci]
  pull_request:
  workflow_dispatch:

jobs:
  uvr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uvr
        run: |
          curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: uvr --version && uvr doctor || true

      - name: Install pinned R
        run: uvr r install 4.5.3

      # uvr's sysreq resolver asks for `chromium`, which on Ubuntu 24.04 maps to
      # the `chromium-browser` snap stub — dpkg fails on it in CI and takes the
      # whole sync down with it. The runner already ships Chrome for shinytest2,
      # so install the rest by hand and let uvr sync without the flag. BLAS/LAPACK
      # are added on top: uvr does not list them, but Matrix builds from source
      # here and its .so needs liblapack.so.3 at load time.
      - name: System dependencies (minus chromium)
        run: |
          sudo apt-get install -y cmake libbz2-dev libcurl4-openssl-dev \
            liblzma-dev libnode-dev libpng-dev libuv1-dev pandoc \
            libblas-dev liblapack-dev gfortran

      - name: Sync dependencies from lockfile
        run: uvr sync --frozen

      - name: R CMD build + check
        run: |
          uvr activate --write-shim
          . ./.uvr/activate
          R --version
          R CMD build .
          R CMD check --no-manual "$(ls -1t igvShiny_*.tar.gz | head -1)"

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvr-check-log
          path: igvShiny.Rcheck/00check.log
          if-no-files-found: ignore
