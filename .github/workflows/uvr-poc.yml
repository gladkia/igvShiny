name: uvr PoC

# Proof of concept: resolve and install this package's dependency tree with uvr
# (https://github.com/nbafrank/uvr) instead of the usual Bioconductor container
# + r-lib/actions path, then run the standard R CMD build/check on top of it.
# Runs alongside check-bioc.yml — it does not replace it.

on:
  push:
    branches: [poc/uvr-ci]
  pull_request:
  workflow_dispatch:

jobs:
  uvr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uvr
        run: |
          curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: uvr --version && uvr doctor || true

      # `.uvr/library` holds compiled .so, so the key binds everything that fixes
      # the ABI: OS, arch, R version, lockfile. The restore-keys prefix is the
      # point of the whole exercise — change one dependency and the old key still
      # restores the other 134 packages, leaving uvr only the delta to install.
      # A container image cannot do that; it either has the tree or rebuilds it.
      - name: Cache uvr library
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            .uvr/library
            ~/.uvr/cache
          key: uvr-${{ runner.os }}-${{ runner.arch }}-r4.5.3-${{ hashFiles('uvr.lock') }}
          restore-keys: |
            uvr-${{ runner.os }}-${{ runner.arch }}-r4.5.3-

      - name: Report cache state
        run: |
          echo "cache-hit (exact): ${{ steps.cache.outputs.cache-hit }}"
          echo "restored key:      ${{ steps.cache.outputs.cache-matched-key }}"
          echo "packages in lock:    $(grep -c '^\[\[package\]\]' uvr.lock)"
          echo "packages in library: $(ls -1 .uvr/library 2>/dev/null | grep -cv '^uvr$' || echo 0)"

      - name: Install pinned R
        run: uvr r install 4.5.3

      # uvr's sysreq resolver asks for `chromium`, which on Ubuntu 24.04 maps to
      # the `chromium-browser` snap stub — dpkg fails on it in CI and takes the
      # whole sync down with it. The runner already ships Chrome for shinytest2,
      # so install the rest by hand and let uvr sync without the flag. BLAS/LAPACK
      # are added on top: uvr does not list them, but Matrix builds from source
      # here and its .so needs liblapack.so.3 at load time.
      - name: System dependencies (minus chromium)
        run: |
          sudo apt-get install -y cmake libbz2-dev libcurl4-openssl-dev \
            liblzma-dev libnode-dev libpng-dev libuv1-dev pandoc \
            libblas-dev liblapack-dev gfortran

      # P3M serves a source tarball for some packages (restfulr here) and uvr
      # aborts the whole sync instead of falling back to a source build. Take the
      # binaries first, then let a second pass build whatever is still missing.
      - name: Sync dependencies from lockfile
        run: uvr sync --frozen || uvr sync --frozen --no-binary

      - name: R CMD build + check
        run: |
          uvr activate --write-shim
          . ./.uvr/activate
          R --version
          R CMD build .
          R CMD check --no-manual "$(ls -1t igvShiny_*.tar.gz | head -1)"

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvr-check-log
          path: igvShiny.Rcheck/00check.log
          if-no-files-found: ignore

  # --- nbafrank/uvr#228 repro -------------------------------------------------
  #
  # On HPC clusters BLAS/LAPACK arrives through `module load`, i.e. reachable only
  # via LD_LIBRARY_PATH and never through the loader cache. uvr's R CMD INSTALL
  # subprocess *replaces* LD_LIBRARY_PATH instead of prepending to it, so source
  # builds lose the library. nbafrank/uvr#229 prepends.
  #
  # The probe is S4Arrays, not Matrix. Installing Matrix only *builds* it, and the
  # bug lives on the load path: R CMD INSTALL of S4Arrays calls dyn.load on
  # Matrix.so inside the subprocess whose LD_LIBRARY_PATH was replaced. That is
  # the exact signature the igvShiny sync hit — "Failed to install S4Arrays ...
  # liblapack.so.3: cannot open shared object file". A Matrix-only probe passes
  # on stock uvr and reports the bug as absent.
  #
  # The two binaries run in SEPARATE JOBS on purpose: they share ~/.uvr/cache, and
  # in the single-job version the second binary just restored what the first one
  # had built — 2m45s of real compilation followed by a 3s "success" that proved
  # nothing. A fresh runner each is the only cheap way to guarantee no shared state.
  #
  # Each job asserts its own expectation, so the job status *is* the verdict. No
  # continue-on-error, no cross-job plumbing, no green job hiding a false result.

  repro-stock:
    name: "uvr#228 repro — stock (must FAIL to install)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stock uvr
        run: |
          curl -fsSL https://raw.githubusercontent.com/nbafrank/uvr/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned R
        run: uvr r install 4.5.3

      - name: Hide LAPACK from the loader
        run: .github/scripts/hide-lapack.sh

      - name: S4Arrays source install — expected to FAIL
        env:
          LD_LIBRARY_PATH: /opt/blas
          UVR_NO_BINARY: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/p" && cd "$RUNNER_TEMP/p"
          uvr init --here repro --r-version ">=4.5.0"
          if uvr add --bioc S4Arrays; then
            echo "::error::stock uvr installed S4Arrays — the repro no longer isolates #228"
            exit 1
          fi
          echo "stock uvr failed as expected — bug reproduced"

  repro-patched:
    name: "uvr#228 repro — patched (must SUCCEED)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build patched uvr from nbafrank/uvr#229
        run: |
          git clone --depth 1 -b fix/ld-library-path-inheritance \
            https://github.com/gladkia/uvr.git "$RUNNER_TEMP/uvr-src"
          cargo build --release --manifest-path "$RUNNER_TEMP/uvr-src/Cargo.toml"
          install -D -m755 "$RUNNER_TEMP/uvr-src/target/release/uvr" "$HOME/.local/bin/uvr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned R
        run: uvr r install 4.5.3

      - name: Hide LAPACK from the loader
        run: .github/scripts/hide-lapack.sh

      - name: S4Arrays source install — expected to SUCCEED
        env:
          LD_LIBRARY_PATH: /opt/blas
          UVR_NO_BINARY: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/p" && cd "$RUNNER_TEMP/p"
          uvr init --here repro --r-version ">=4.5.0"
          uvr add --bioc S4Arrays
          echo "patched uvr installed S4Arrays through LD_LIBRARY_PATH — fix confirmed"
