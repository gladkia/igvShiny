## Read more about GitHub actions the features of this GitHub Actions workflow
## at https://lcolladotor.github.io/biocthis/articles/biocthis.html#use_bioc_github_action
##
## For more details, check the biocthis developer notes vignette at
## https://lcolladotor.github.io/biocthis/articles/biocthis_dev_notes.html
##
## You can add this workflow to other packages using:
## > biocthis::use_bioc_github_action()
##
## Using GitHub Actions exposes you to many details about how R packages are
## compiled and installed in several operating system.s
### If you need help, please follow the steps listed at
## https://github.com/r-lib/actions#where-to-find-help
##
## If you found an issue specific to biocthis's GHA workflow, please report it
## with the information that will make it easier for others to help you.
## Thank you!

## Acronyms:
## * GHA: GitHub Action
## * OS: operating system

## Pushes to a branch with an open pull request used to run the whole matrix
## twice on the same commit - once for the push, once for the pull_request -
## doubling both the wait and the load on bioconductor.org
## The macOS and Windows jobs spend most of their 80 minutes compiling the Bioc
## devel dependency tree from source - devel ships no binaries for either, and it
## moves daily, so the package cache can never fully cover it. Linux runs in the
## Bioconductor container and finishes in a fraction of that. Pull requests
## therefore check Linux only, and the full matrix runs where a slow answer still
## arrives in time to matter: on master, nightly, and on any pull request carrying
## the full-ci label
on:
  push:
    branches:
      - master
  ## labeled is on the list so that adding full-ci to an open pull request
  ## starts a run - the default types fire only on open, push and reopen
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

name: R-CMD-check-bioc

## A new commit makes the previous run's result irrelevant, so stop it and free
## the runner. Only for pull requests: a master run also deploys pkgdown and
## pushes to Bioconductor, and those must be allowed to finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

## These environment variables control whether to run GHA code later on that is
## specific to testthat, covr, and pkgdown.
##
## If you need to clear the cache of packages, update the number inside
## cache-version as discussed at https://github.com/r-lib/actions/issues/86.
## Note that you can always run a GHA test without the cache by using the word
## "/nocache" in the commit message.
env:
  has_testthat: 'true'
  run_covr: 'true'
  run_pkgdown: 'true'
  has_RUnit: 'true'
  cache-version: 'cache-v1'
  run_docker: 'false'
  pkg_name: 'igvShiny'
  gref_pkgdown: 'refs/heads/master'
  ## Set to a mirror (e.g. 'https://ftp.gwdg.de/pub/misc/bioconductor') to take
  ## package downloads off bioconductor.org while it is unwell - on 2026-07-25 it
  ## served 504s for over an hour and 'Set BiocVersion' alone took 23-53 minutes.
  ## Left empty by default: mirrors sync once a day, and a package tracking Bioc
  ## devel wants today's devel, not yesterday's
  bioc_mirror: ''

jobs:
  build-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    container: ${{ matrix.config.cont }}
    ## A healthy run takes well under 30 minutes; anything past two hours is a
    ## stuck download, not slow work
    timeout-minutes: 120
    ## Environment variables unique to this job.


    strategy:
      fail-fast: false
      matrix:
        ## Linux always; macOS and Windows unless this is a plain pull request.
        ## Keep the two lists in step - the Linux entry is repeated verbatim
        config: ${{ (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('[{"os":"ubuntu-latest","r":"4.5","bioc":"devel","cont":"bioconductor/bioconductor_docker:devel","rspm":"https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"}]') || fromJSON('[{"os":"ubuntu-latest","r":"4.5","bioc":"devel","cont":"bioconductor/bioconductor_docker:devel","rspm":"https://packagemanager.rstudio.com/cran/__linux__/jammy/latest"},{"os":"macOS-latest","r":"4.6","bioc":"devel"},{"os":"windows-latest","r":"4.6","bioc":"devel"}]') }}
        ## Check https://github.com/r-lib/actions/tree/master/examples
        ## for examples using the http-user-agent
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      NOT_CRAN: true
      TZ: UTC
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:

      ## Set the R library to the directory matching the
      ## R packages cache step further below when running on Docker (Linux).
      - name: Set R Library home on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir /__w/_temp/Library
          echo ".libPaths('/__w/_temp/Library')" > ~/.Rprofile

      ## Most of these steps are the same as the ones in
      ## https://github.com/r-lib/actions/blob/master/examples/check-standard.yaml
      ## If they update their steps, we will also need to update ours.
      - name: Checkout Repository
        uses: actions/checkout@v4

      ## R is already included in the Bioconductor docker images
      - name: Setup R from r-lib
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      ## pandoc is already included in the Bioconductor docker images
      - name: Setup pandoc from r-lib
        if: runner.os != 'Linux'
        uses: r-lib/actions/setup-pandoc@v2

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
        shell: Rscript {0}

      - name: Restore R package cache
        if: "!contains(github.event.head_commit.message, '/nocache') && runner.os != 'Linux'"
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ env.cache-version }}-${{ runner.os }}-biocversion-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ env.cache-version }}-${{ runner.os }}-biocversion-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-

      - name: Cache R packages on Linux
        if: "!contains(github.event.head_commit.message, '/nocache') && runner.os == 'Linux' "
        uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/Library
          key: ${{ env.cache-version }}-${{ runner.os }}-biocversion-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ env.cache-version }}-${{ runner.os }}-biocversion-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # google-chromer for shinytest2 (via chromote)
          apt-get update && wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
          && dpkg -i ./google-chrome-stable_current_amd64.deb || true \
          && rm google-chrome-stable_current_amd64.deb\
          && apt-get -f -y install

          #sysreqs=$(Rscript -e 'cat("apt-get update -y && apt-get install -y", paste(gsub("apt-get install -y ", "", remotes::system_requirements("ubuntu", "20.04")), collapse = " "))')
          #echo $sysreqs
          #sudo -s eval "$sysreqs"
      
      - name: Install macOS system dependencies
        if: matrix.config.os == 'macOS-latest'
        run: |
          ## Enable installing XML from source if needed
          brew install libxml2
          echo "XML_CONFIG=/usr/local/opt/libxml2/bin/xml2-config" >> $GITHUB_ENV

          ## Required to install magick as noted at
          ## https://github.com/r-lib/usethis/commit/f1f1e0d10c1ebc75fd4c18fa7e2de4551fd9978f#diff-9bfee71065492f63457918efcd912cf2
          brew install imagemagick@6

          ## For textshaping, required by ragg, and required by pkgdown
          brew install harfbuzz fribidi

          ## For installing usethis's dependency gert
          brew install libgit2

          ## Required for tcltk
          brew install xquartz --cask

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: |
          ## Edit below if you have any Windows system dependencies
        shell: Rscript {0}

      - name: Install BiocManager
        run: |
          message(paste('****', Sys.time(), 'installing BiocManager ****'))
          remotes::install_cran("BiocManager")
        shell: Rscript {0}

      - name: Point BiocManager at a mirror
        if: env.bioc_mirror != ''
        run: |
          ## BiocManager reads no environment variable for this - only the
          ## option - so it goes into the profile the later steps will load
          cat(
              sprintf('options(BioC_mirror = "%s")\n', Sys.getenv("bioc_mirror")),
              file = file.path(Sys.getenv("HOME"), ".Rprofile"),
              append = TRUE
          )
        shell: Rscript {0}

      ## The bioconductor_docker:devel container is already pinned to devel, so
      ## on Linux this step reinstalls BiocVersion to reach the version it is
      ## already at - 23 minutes of it on 2026-07-25
      ## Called without pkgs, install() defaults to update = TRUE, meaning "bring
      ## every installed package up to this version's repositories". Bioc devel
      ## ships no macOS or Windows binaries, so that compiles the world from
      ## source on every run - 52 of the job's 84 minutes on 2026-07-25, undoing
      ## the package cache that was just restored. The dependencies this package
      ## actually needs are installed by the two passes below
      - name: Set BiocVersion
        if: runner.os != 'Linux' || matrix.config.bioc != 'devel'
        run: |
          BiocManager::install(
              version = "${{ matrix.config.bioc }}",
              ask = FALSE,
              force = TRUE,
              update = FALSE
          )
        shell: Rscript {0}

      ## ... which is only true as long as the image stays devel-pinned, so say
      ## so out loud rather than checking a version nobody asked for
      - name: Verify the container's Bioc version
        if: runner.os == 'Linux' && matrix.config.bioc == 'devel'
        run: |
          have <- as.character(BiocManager::version())
          ## resolving what "devel" means today needs bioconductor.org, and this
          ## step exists to survive that host being down - so a failed lookup
          ## warns, only a real mismatch stops the build
          want <- try(as.character(BiocManager:::.version_bioc("devel")), silent = TRUE)
          if (inherits(want, "try-error")) {
              warning("could not reach bioconductor.org to confirm; container reports ", have)
          } else if (!identical(have, want)) {
              stop("container is on Bioc ", have, ", expected devel (", want, ")")
          }
          message("container Bioc version: ", have)
        shell: Rscript {0}

      - name: Install dependencies pass 1
        run: |
          ## Try installing the package dependencies in steps. First the local
          ## dependencies, then any remaining dependencies to avoid the
          ## issues described at
          ## https://stat.ethz.ch/pipermail/bioc-devel/2020-April/016675.html
          ## https://github.com/r-lib/remotes/issues/296
          ## Ideally, all dependencies should get installed in the first pass.

          ## For running the checks
          message(paste('****', Sys.time(), 'installing rcmdcheck and BiocCheck ****'))
          install.packages(c("rcmdcheck", "BiocCheck", "gDRstyle"), repos = BiocManager::repositories())

          ## Pass #1 at installing dependencies
          message(paste('****', Sys.time(), 'pass number 1 at installing dependencies: local dependencies ****'))
          remotes::install_local(dependencies = TRUE, repos = BiocManager::repositories(), build_vignettes = FALSE, upgrade = TRUE)
        continue-on-error: true
        shell: Rscript {0}

      - name: Install dependencies pass 2
        run: |
          ## Pass #2 at installing dependencies
          message(paste('****', Sys.time(), 'pass number 2 at installing dependencies: any remaining dependencies ****'))
          remotes::install_local(dependencies = TRUE, repos = BiocManager::repositories(), build_vignettes = TRUE, upgrade = TRUE, force = TRUE)
        shell: Rscript {0}

      - name: Install BiocGenerics
        if:  env.has_RUnit == 'true'
        run: |
          ## Install BiocGenerics
          BiocManager::install("BiocGenerics")
        shell: Rscript {0}

      - name: Install covr
        if: github.ref == 'refs/heads/devel' && env.run_covr == 'true' && runner.os == 'Linux'
        run: |
          remotes::install_cran("covr")
        shell: Rscript {0}

      - name: Install pkgdown
        if: env.run_pkgdown == 'true'
        run: |
          remotes::install_cran("pkgdown")
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}

      # Show google chrome path on envs
      - name: Provide info about google-chrome path
        run: |
          #${{ steps.setup-chrome.outputs.chrome-path }} --version
          chromote:::find_chrome()
        shell: Rscript {0}

      - name: Run CMD check
        env:
          _R_CHECK_CRAN_INCOMING_: false
          DISPLAY: 99.0
        run: |
          options(crayon.enabled = TRUE)
          #rcmdcheck::rcmdcheck(
          #    args = c("--no-manual", "--no-vignettes", "--timings"),
          #    build_args = c("--no-manual", "--keep-empty-dirs", "--no-resave-data"),
          #    error_on = "warning",
          #    check_dir = "check"
          #)
          # wrapper of rcmdcheck with some improvements:
          # - notes can be controlled
          # - linter checks
          # TODO: use BiocCheck with `bioc_check = TRUE`
          gDRstyle::checkPackage(pkg_name, repoDir = ".")
        shell: Rscript {0}

      ## Might need an to add this to the if:  && runner.os == 'Linux'
      - name: Reveal testthat details
        if:  env.has_testthat == 'true'
        run: find . -name testthat.Rout -exec cat '{}' ';'

      - name: Run BiocCheck
        env:
          DISPLAY: 99.0
        run: |
          build_file <- pkgbuild::build(".")
          ## The deprecation check is the one BiocCheck step that reaches out to
          ## bioconductor.org (checkResults/*/meat-index.dcf). That endpoint
          ## served 504s for hours on 2026-07-25 and 2026-07-26, failing the whole
          ## run on all three systems, and it only reports whether a package is
          ## deprecated in Bioc - which this one is not
          BiocCheck::BiocCheck(
              #dir('check', 'tar.gz$', full.names = TRUE),
              build_file,
              `quit-with-status` = TRUE,
              `no-check-R-ver` = TRUE,
              `no-check-bioc-help` = TRUE,
              `no-check-deprecated` = TRUE
          )
        shell: Rscript {0}

      ## Coverage runs on every Linux build, not just one branch, so PRs show
      ## the delta. Note that shinytest2 tests launch the app in a separate
      ## process, so covr does not see the code they exercise — the number
      ## here reflects unit tests and examples only.
      - name: Test coverage
        if: env.run_covr == 'true' && runner.os == 'Linux'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          remotes::install_cran("covr")
          cov <- covr::package_coverage(type = "all")
          print(cov)
          cat(sprintf("TOTAL COVERAGE: %.2f%%\n", covr::percent_coverage(cov)))
          ## Upload only when the repository has a Codecov token configured;
          ## without it the upload fails and would take the whole job down.
          if (nzchar(Sys.getenv("CODECOV_TOKEN"))) {
            covr::codecov(coverage = cov)
          } else {
            message("CODECOV_TOKEN not set - skipping upload, printed summary only")
          }
        shell: Rscript {0}

      - name: Install package
        if: github.ref == env.gref_pkgdown && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: R CMD INSTALL .

      - name: Build pkgdown site
        if: github.ref == env.gref_pkgdown && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
        ## Note that you need to run pkgdown::deploy_to_branch(new_process = FALSE)
        ## at least one locally before this will work. This creates the gh-pages
        ## branch (erasing anything you haven't version controlled!) and
        ## makes the git history recognizable by pkgdown.

      - name: Install deploy dependencies
        if: github.ref == env.gref_pkgdown && env.run_pkgdown == 'true' && runner.os == 'Linux'
        run: |
          apt-get update && apt-get -y install rsync

      - name: Deploy pkgdown site to GitHub pages 🚀
        if: github.ref == env.gref_pkgdown && env.run_pkgdown == 'true' && runner.os == 'Linux'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: pages
          folder: docs
          target-folder: docs

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-biocversion-${{ matrix.config.bioc }}-r-${{ matrix.config.r }}-results
          path: check


  ## Code adapted from
  ## https://github.com/waldronlab/cBioPortalData/blob/e0440a4445f0cc731e426363a76faa22ee5e0f9d/.github/workflows/devel_check_dock.yml#L65-L92
  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout Repository
        if: "!contains(github.event.head_commit.message, '/nodocker') && env.run_docker == 'true' && github.ref == 'refs/heads/devel'"
        uses: actions/checkout@v4

      - name: Register repo name
        if: "!contains(github.event.head_commit.message, '/nodocker') && env.run_docker == 'true' && github.ref == 'refs/heads/devel'"
        id: reg_repo_name
        run: |
          echo CONT_IMG_NAME=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]') >> $GITHUB_ENV

      - name: Set up QEMU
        if: "!contains(github.event.head_commit.message, '/nodocker') && env.run_docker == 'true' && github.ref == 'refs/heads/devel'"
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: "!contains(github.event.head_commit.message, '/nodocker') && env.run_docker == 'true' && github.ref == 'refs/heads/devel'"
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: "!contains(github.event.head_commit.message, '/nodocker') && env.run_docker == 'true' && github.ref == 'refs/heads/devel'"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      ## Note that DOCKERHUB_TOKEN is really a token for your dockerhub
      ## account, not your actual dockerhub account password. You can get it
      ## from https://hub.docker.com/settings/security.
      ## Check https://github.com/docker/build-push-action/tree/v4.0.0
      ## for more details.
      ## Alternatively, try checking
      ## https://seandavi.github.io/BuildABiocWorkshop/articles/HOWTO_BUILD_WORKSHOP.html.

      - name: Build and Push Docker
        if: "!contains(github.event.head_commit.message, '/nodocker') && env.run_docker == 'true' && github.ref == 'refs/heads/devel' && success()"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: >
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT_IMG_NAME }}:latest,
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT_IMG_NAME }}:devel
