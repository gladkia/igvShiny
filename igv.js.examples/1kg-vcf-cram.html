<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="shortcut icon" href="https://igv.org/web/img/favicon.ico">

    <title>igv.js</title>
    <!--script src="../dist/igv.min.js"></script-->
    <script src="../inst/htmlwidgets/lib/igv-3.8.4.min.js"></script>

</head>

<body>

<p>

<h1>1000 Genomes VCF file</h1>

<div id="igvDiv" style="padding-top: 10px;padding-bottom: 10px; border:1px solid lightgray"></div>

<script type="text/javascript">

    document.addEventListener("DOMContentLoaded", function () {

        var options =
            {
                // This used to spell the reference out - fastaURL plus
                // cytobandURL on s3.amazonaws.com/igv.broadinstitute.org - as
                // an example of doing so. That bucket answers 403 now, and
                // upstream's own copy of this example (examples/cram-vcf.html)
                // names the stock genome instead, which the old comment here
                // already gave as the alternative.
                genome: "hg19",
                locus: "myc",
                tracks:
                    [
                        {
                            name: "Phase 3 WGS variants",
                            type: "variant",
                            format: "vcf",
                            url: "https://s3.amazonaws.com/1000genomes/release/20130502/ALL.wgs.phase3_shapeit2_mvncall_integrated_v5b.20130502.sites.vcf.gz",
                            indexURL: "https://s3.amazonaws.com/1000genomes/release/20130502/ALL.wgs.phase3_shapeit2_mvncall_integrated_v5b.20130502.sites.vcf.gz.tbi"
                        },
                        {
                            type: 'alignment',
                            format: 'cram',
                            url: 'https://s3.amazonaws.com/1000genomes/phase3/data/HG00096/exome_alignment/HG00096.mapped.ILLUMINA.bwa.GBR.exome.20120522.bam.cram',
                            indexURL: 'https://s3.amazonaws.com/1000genomes/phase3/data/HG00096/exome_alignment/HG00096.mapped.ILLUMINA.bwa.GBR.exome.20120522.bam.cram.crai',
                            name: 'HG00096'
                        }
                        // the refGene track that stood here fetched two more
                        // files from the same dead bucket; the hg19 stock
                        // genome brings its own gene annotation
                    ]

            };

        var igvDiv = document.getElementById("igvDiv");

        igv.createBrowser(igvDiv, options)
            .then(function (browser) {
                console.log("Created IGV browser");
            })

    })

</script>

</body>

</html>
